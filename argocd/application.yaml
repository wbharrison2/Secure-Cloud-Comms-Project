apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: artisan-gem-works
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wbharrison2/secure-cloud-comms-project
    targetRevision: demo/project-6-franchise-zerotrust
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: artisan-gem-works
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
