version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agwdb
      POSTGRES_USER: agw
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agw -d agwdb']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass devpassword
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'devpassword', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://agw:devpassword@postgres:5432/agwdb
      REDIS_URL: redis://:devpassword@redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      COOKIE_NAME: agw_token
      COOKIE_SECURE: 'false'
      STRIPE_SECRET_KEY: sk_test_your_stripe_key
      STRIPE_PUBLISHABLE_KEY: pk_test_your_stripe_key
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '3000:3000'
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    ports:
      - '80:80'
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
