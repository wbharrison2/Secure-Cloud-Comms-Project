apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: agw-app
  namespace: artisan-gem-works
spec:
  hosts:
  - artisangemworks.com
  - www.artisangemworks.com
  gateways:
  - agw-gateway
  http:
  - match:
    - uri:
        prefix: /api/
    - uri:
        prefix: /public/
    - uri:
        exact: /
    route:
    - destination:
        host: agw-app
        port:
          number: 80
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,retriable-4xx
