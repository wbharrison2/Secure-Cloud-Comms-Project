# SecretStore: tells External Secrets Operator how to reach AWS Secrets Manager.
# Authentication uses IRSA (the agw-app ServiceAccount has an IAM role annotation).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: artisan-gem-works
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: agw-app
