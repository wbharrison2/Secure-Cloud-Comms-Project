# ExternalSecret: maps AWS Secrets Manager paths to the agw-secrets Kubernetes Secret.
# ESO refreshes every hour; when JWT rotates (30 days) or DB/Redis rotates (90 days)
# the new value propagates here and triggers a rolling restart.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agw-secrets
  namespace: artisan-gem-works
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: agw-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        DATABASE_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@{{ .db_host }}:5432/artisangemworks"
        REDIS_URL: "rediss://:{{ .redis_auth_token }}@{{ .redis_host }}:6379"
        STRIPE_SECRET_KEY: "{{ .stripe_secret_key }}"
  data:
  - secretKey: jwt_secret
    remoteRef:
      key: artisan-gem-works/production/jwt
      property: secret
  - secretKey: db_username
    remoteRef:
      key: artisan-gem-works/production/database
      property: username
  - secretKey: db_password
    remoteRef:
      key: artisan-gem-works/production/database
      property: password
  - secretKey: db_host
    remoteRef:
      key: artisan-gem-works/production/database
      property: host
  - secretKey: redis_auth_token
    remoteRef:
      key: artisan-gem-works/production/redis
      property: auth_token
  - secretKey: redis_host
    remoteRef:
      key: artisan-gem-works/production/redis
      property: host
  - secretKey: stripe_secret_key
    remoteRef:
      key: artisan-gem-works/production/stripe
      property: secret_key
